<!--
  Gear Inspection App
  Progression Vertical Operations System

  Current feature: Load gear by category
  Staff select a category to see the active gear list for inspection.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gear Inspection — Progression Vertical</title>
  <link rel="stylesheet" href="../shared/styles.css" />
  <link rel="stylesheet" href="inspection.css" />
</head>
<body>

  <!-- Page header with back link -->
  <div class="page-header">
    <a href="../index.html" class="back-link" title="Home">←</a>
    <div>
      <h1>Gear Inspection</h1>
      <div class="subtitle">Select a category to begin</div>
    </div>
  </div>

  <!-- Step 1: Category selection with dashboard -->
  <section id="step-category">

    <!-- Dashboard date picker -->
    <div class="dashboard-bar">
      <label for="dashboard-date">Inspection Status for</label>
      <input type="date" id="dashboard-date" />
    </div>

    <!-- Category buttons with status badges -->
    <div class="category-grid">
      <button class="category-btn" data-category="FIT">
        <span class="cat-name">FIT</span>
        <span id="status-FIT" class="cat-status"></span>
      </button>
      <button class="category-btn" data-category="Gym">
        <span class="cat-name">Gym</span>
        <span id="status-Gym" class="cat-status"></span>
      </button>
      <button class="category-btn" data-category="Caving">
        <span class="cat-name">Caving</span>
        <span id="status-Caving" class="cat-status"></span>
      </button>
      <button class="category-btn" data-category="Outdoor Rental">
        <span class="cat-name">Outdoor Rental</span>
        <span id="status-Outdoor Rental" class="cat-status"></span>
      </button>
      <button class="category-btn" data-category="Route Setting">
        <span class="cat-name">Route Setting</span>
        <span id="status-Route Setting" class="cat-status"></span>
      </button>
    </div>
  </section>

  <!-- Step 2: Gear list (hidden until a category is selected) -->
  <section id="step-gear-list" class="hidden">

    <!-- Shows which category is selected and item count -->
    <div class="selected-category-bar">
      <span id="selected-category-name"></span>
      <span id="gear-count" class="badge badge-count"></span>
    </div>

    <!-- Inspector info fields -->
    <div class="inspector-fields card">
      <div class="field-row">
        <label for="inspector-name">Inspector Name</label>
        <input type="text" id="inspector-name" placeholder="Enter your name" autocomplete="off" />
      </div>
      <div class="field-row">
        <label for="inspection-date">Date</label>
        <input type="date" id="inspection-date" />
      </div>
    </div>

    <!-- Gear inspection form renders here -->
    <div id="gear-list-container">
      <!-- Filled by inspection.js -->
    </div>

    <!-- Validation summary and submit button -->
    <div id="submit-section" class="hidden">
      <div id="validation-summary"></div>
      <button id="submit-btn" class="btn btn-primary btn-full" disabled>
        Submit Inspection
      </button>
    </div>
  </section>

  <!-- Step 3: Success screen (shown after successful submit) -->
  <section id="step-success" class="hidden">
    <div class="success-card">
      <div class="success-icon">✓</div>
      <h2>Inspection Submitted</h2>
      <p id="success-details"></p>
      <button id="new-inspection-btn" class="btn btn-primary btn-full mt-16">
        Start New Inspection
      </button>
    </div>
  </section>

  <!-- Scripts: config first, then api helper, then app logic -->
  <script src="../shared/config.js"></script>
  <script src="../shared/api.js"></script>
  <script src="inspection.js"></script>
</body>
</html>
